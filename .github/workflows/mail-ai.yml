name: Local mail AI

on:
  push:
    paths:
      - 'experiments/mail-ai/**'
      - 'backend/src/**'
      - 'backend/server.ts'
      - 'contracts/**'
      - '.github/workflows/mail-ai.yml'
  pull_request:
    paths:
      - 'experiments/mail-ai/**'
      - 'backend/src/**'
      - 'backend/server.ts'
      - 'contracts/**'
      - '.github/workflows/mail-ai.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Mail and Canvas tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: experiments/mail-ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test "tests/*.test.mjs"
